services:
  xts-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        XTS_UID: ${XTS_UID:-1000}
        XTS_GID: ${XTS_GID:-1000}
    container_name: xts-agent-runner
    # Host networking is typically required to reach host-side ADB/Cuttlefish.
    network_mode: "host"
    # Prefer not using privileged; enable only if KVM device management is required.
    # privileged: true
    volumes:
      - ${XTS_PACKAGES_DIR:-/opt/xts}:/opt/xts:ro
      - ${XTS_RESULTS_DIR:-../results}:/app/results
      # ADB keys, read-only, into the unprivileged user's home
      - ${ANDROID_HOST_KEYS:-${HOME}/.android}:/home/xts/.android:ro
      # Must be the platform-tools whose adb runs the host adb server
      # (`which adb` on the host), or the container client restarts it.
      - ${HOST_PLATFORM_TOOLS:-/opt/xts/platform-tools}:/host-platform-tools:ro
      # Device leases + quarantine ledger must be shared with every other
      # agent on this host (native or containerised), or two runs can grab
      # the same device
      - /var/tmp/xts-agent:/var/tmp/xts-agent
    environment:
      - XTS_PACKAGES_DIR=/opt/xts
      - ANDROID_HOME=/opt/android-sdk
      - ANDROID_SDK_ROOT=/opt/android-sdk
      # Secrets come from the host environment / secret store, never the image
      - XTS_ATS2_API_KEY
      - XTS_SLACK_WEBHOOK
      - XTS_GEMINI_API_KEY
      - XTS_JIRA_TOKEN
      - XTS_DATABASE_URL
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
    working_dir: /app
    restart: "no"
    # tini as PID 1 reaps TradeFed's forked children and forwards signals
    init: true
    # On `docker stop` the agent stops TradeFed (which flushes partial
    # results) and writes its checkpoint; give it time before SIGKILL
    stop_grace_period: 3m
