<style>

* { box-sizing: border-box; }

  padding: 7px 13px; border-radius: 8px; cursor: pointer; white-space: nowrap; }

label.chk { display: inline-flex; gap: 7px; align-items: center; margin-right: 14px; cursor: pointer; }

.st { flex: 1; min-width: 86px; position: relative; text-align: center; }

.stepper.compact .st::before { left: calc(-50% + 14px); right: calc(50% + 14px); top: 12px; } .stepper.compact .st .b { width: 26px; height: 26px; }
.st::before { content: ""; position: absolute; top: 14px; left: calc(-50% + 17px); right: calc(50% + 17px); height: 2px; background: var(--border-2); }
.st:first-child::before { display: none; } .st.done::before, .st.cur::before, .st.bad::before { background: var(--accent); }
.st .b { width: 30px; height: 30px; border-radius: 50%; margin: 0 auto 6px; display: grid; place-items: center; background: var(--panel-3); color: var(--faint); border: 2px solid var(--border-2); position: relative; z-index: 1; }
.st .b svg { width: 14px; height: 14px; }
.st.done .b { background: var(--accent); border-color: var(--accent); color: #fff; }
.st.cur .b { background: var(--panel); border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 18%, transparent); }
.st.bad .b { background: var(--bad); border-color: var(--bad); color: #fff; }
.st .n { font-size: 12.5px; font-weight: 600; color: var(--text-2); } .st .t { font-size: 11.5px; color: var(--faint); font-family: var(--mono); }
.st.todo .n { color: var(--faint); font-weight: 500; }
.hero { overflow: hidden; }
.hero-top { padding: 18px 20px 16px; display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 8%, transparent), transparent); }
.hero-top h2 { margin: 0; font-size: 18px; letter-spacing: -.2px; } .hero-top .meta { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
.timer { text-align: right; } .timer .v { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.5px; line-height: 1.1; } .timer .k { color: var(--muted); font-size: 12px; }

.metrics .k { color: var(--muted); font-size: 12px; font-weight: 500; } .metrics .v { font-size: 22px; font-weight: 700; letter-spacing: -.3px; }

.prog > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), #22d3ee); transition: width .6s ease; }
.prog.indet > i { width: 35% !important; animation: indet 1.6s ease-in-out infinite; } @keyframes indet { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }

.devgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }

.dev::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--skip); }
.dev.busy::before { background: var(--info); } .dev.busy { background: color-mix(in srgb, var(--info) 7%, var(--panel-2)); }
.dev .top { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.dev .top .d { width: 7px; height: 7px; border-radius: 50%; background: var(--skip); } .dev.busy .top .d { background: var(--info); }
.dev .m { font-weight: 600; font-size: 13.5px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dev .f { font-size: 11.5px; color: var(--faint); margin-top: 2px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); padding: 0 16px; overflow-x: auto; }
.tabs button { font: inherit; font-size: 13px; font-weight: 600; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 11px 12px 9px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; white-space: nowrap; }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
.tabs .cnt { background: var(--bad-soft); color: var(--bad); border-radius: 99px; font-size: 11px; padding: 0 7px; }
.log { background: var(--log-bg); color: var(--log-text); font-family: var(--mono); font-size: 12px; line-height: 1.55; height: 420px; overflow: auto;
  padding: 12px 14px; border-radius: 10px; white-space: pre-wrap; word-break: break-all; border: 1px solid #1a2133; }
.log .f { color: #ff8d8d; } .log .w { color: #f3c470; } .log .i { color: #86c5ff; } .log .ts { color: #59647c; }
.logbar { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.feed { max-height: 440px; overflow: auto; }

.feed .it:last-child { border-bottom: 0; } .feed .tm { font-family: var(--mono); font-size: 11.5px; color: var(--faint); padding-top: 2px; }
.feed .tn { font-family: var(--mono); font-size: 12.5px; font-weight: 600; word-break: break-all; } .feed .ms { color: var(--muted); font-size: 12.5px; margin-top: 2px; word-break: break-word; }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { position: relative; padding: 0 0 14px 22px; font-size: 13px; }
.tl li::before { content: ""; position: absolute; left: 5px; top: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.tl li::after { content: ""; position: absolute; left: 8.5px; top: 17px; bottom: -2px; width: 1px; background: var(--border-2); }
.tl li:last-child::after { display: none; } .tl li.bad::before { background: var(--bad); } .tl li.ok::before { background: var(--ok); }
.tl .w { font-family: var(--mono); font-size: 11.5px; color: var(--faint); }
table { border-collapse: collapse; width: 100%; }

th.sort { cursor: pointer; user-select: none; } th.sort:hover { color: var(--text); }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--panel-2); }
.tw { overflow: auto; }

.empty { text-align: center; padding: 34px 16px; color: var(--muted); }

.seg button + button { border-left: 1px solid var(--border-2); } .seg button.on { background: var(--accent-soft); color: var(--accent); }

  max-width: min(440px, calc(100vw - 40px)); z-index: 50; box-shadow: var(--shadow-lg); display: flex; gap: 10px; align-items: center; }

  .app { grid-template-columns: 1fr; }
  aside { height: auto; flex-direction: row; align-items: center; padding: 8px 10px; z-index: 10; overflow-x: auto; }

  .recent .it { grid-template-columns: minmax(0, 1fr) 92px; } .recent .it .sbar { display: none; }
  .timer { text-align: left; }
}

      $("#go").disabled = !!missing; $("#gohint").textContent = missing ? "Install the missing suite packages first." : p.name;
      $("#cmd").hidden = false;
      const derived = mods.length || $("#ai").value || arch !== planArch;
      $("#cmd").textContent = `$ xts-agent run --plan ${derived ? "results/ui_plans/" + p.file.replace(".yaml", ".<run>.yaml") : "config/test_plans/" + p.file}` +
        ($("#retry").checked ? " --auto-retry" : "") + ($("#resume").checked ? " --resume" : "") + ($("#dry").checked ? " --dry-run" : "") +
        (arch !== planArch ? `\n# arch: ${arch}` : "") + (mods.length ? `\n# include_filters: ${mods.join(", ")}` : "");
    };
    $$("#archseg button").forEach((b) => b.addEventListener("click", () => setArch(b.dataset.a)));
    ["#mods", "#retry", "#resume", "#dry", "#ai"].forEach((s) => $(s).addEventListener("input", upd));
    $("#go").dataset.planArch = planArch;
    setArch(keep || planArch);
  };
  render(); renderOpts();
  api("/api/devices").then((ds) => {
    devs = ds;
    const on = ds.filter((d) => d.state === "device"), busy = on.filter((d) => d.leased_by), q = ds.filter((d) => d.quarantine);
    const builds = [...new Set(on.map((d) => d.fingerprint).filter(Boolean))], abis = [...new Set(on.map((d) => d.abi).filter(Boolean))];
    const row = (t, l, v) => `<div class="row" style="justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)"><span class="row" style="gap:9px"><span class="pill t-${t}" style="padding:3px"><span class="d"></span></span>${l}</span><b>${v}</b></div>`;
    $("#devsum").innerHTML = row("ok", "Online", on.length) + row("info", "Free to allocate", on.length - busy.length) + row("skip", "In use by another run", busy.length) + row("warn", "Quarantined", q.length) +
      row("accent", "CPU ABI", esc(abis.join(", ") || "–")) +
      `<div class="muted" style="font-size:12.5px;margin-top:12px">${builds.length > 1 ? `<b style="color:var(--warn)">${builds.length} different builds online.</b> A suite only shards across devices with the same build.` : builds.length ? "All online devices run the same build." : "No device online."} Devices are health-checked and leased per run, never shared.</div>`;
    if ($("#arch") && $("#arch").value && !$("#archseg button.on")) return;
    if ($("#suiterows")) $$("#archseg button.on").forEach((b) => b.click());
  }).catch((e) => { $("#devsum").textContent = e.message; });
  $("#go").addEventListener("click", async () => {
    const p = plans[sel]; if (!p) return;
    const mods = ($("#mods").value || "").split("\n").map((s) => s.trim()).filter(Boolean);
    const body = { plan: p.file, modules: mods, auto_retry: $("#retry").checked, resume: $("#resume").checked, dry_run: $("#dry").checked };
    if ($("#ai").value) body.ai_rca = $("#ai").value === "1";
    if ($("#arch").value && $("#arch").value !== $("#go").dataset.planArch) body.arch = $("#arch").value;
    $("#go").disabled = true;
    try { const r = await api("/api/launch", { body }); toast(`Started ${r.run_id} (pid ${r.pid})`); location.hash = "#/live"; }
    catch (e) { toast("Launch failed: " + e.message, 7000, "bad"); $("#go").disabled = false; }
  });
};

views.run = async function (key) {
  $("#view").innerHTML = `<div class="row" style="margin-bottom:12px"><a href="#/runs" class="btn sm ghost">← All runs</a></div><div id="detail"><div class="skeleton" style="height:140px;margin-bottom:16px"></div><div class="muted">Reading results. A full CTS result takes a few seconds the first time.</div></div>`;

  const t = r.totals || {}, sumOf = (f) => r.suites.reduce((a, s) => a + ((s.result && s.result.summary && s.result.summary[f]) || 0), 0);
  const pass = t.pass ?? sumOf("pass"), fail = t.fail ?? sumOf("fail"), skip = t.skip ?? sumOf("skip");
  const devs = [...new Set(r.suites.flatMap((s) => s.devices || []))];
  const dur = t.duration ?? (r.finished_at && r.started_at ? r.finished_at - r.started_at : null);
  const mods = r.suites.reduce((a, s) => { const res = s.result || {}; return [a[0] + (res.modules_done || 0), a[1] + (res.modules_total || 0), a[2] + (res.modules || []).filter((m) => !m.done).length]; }, [0, 0, 0]);
  const ts = r.triage_summary;
  $("#detail").innerHTML = `<div class="page-hd"><div><div class="row">${pill(r.overall_status || r.state)}<h1>${esc(r.plan)}</h1></div>
      <p><span class="mono">${esc(r.run_id || r.key)}</span>${r.host ? ` · ${esc(r.user)}@${esc(r.host)}` : ""} · ${fmtTime(r.started_at)}</p></div><div class="spacer"></div>
      ${r.state === "running" ? `<a class="btn primary" href="#/live">${ic("activity")} Watch live</a>` : ""}
      ${r.links.triage_html ? `<a class="btn primary" href="${esc(fileHref(r.links.triage_html))}" target="_blank" rel="noopener">${ic("brain")} Triage page</a>` : ""}
      <button class="btn" id="xjson">${ic("download")} JSON</button><button class="btn" id="xcsv">${ic("download")} CSV</button></div>
    <div class="kpis">${kpi("info", "clock", "Duration", fmtDur(dur), `${devs.length} device${devs.length === 1 ? "" : "s"}`)}${kpi("ok", "check", "Passed", num(pass), (rate(pass, fail) ?? "–") + "% pass rate")}
      ${kpi(fail ? "bad" : "ok", "x", "Failed", num(fail), ts ? `${num(ts.groups)} triage group${ts.groups === 1 ? "" : "s"} · ${num(ts.actionable_groups)} actionable` : "tests")}
      ${kpi(mods[2] ? "warn" : "skip", "layers", "Modules", `${num(mods[0])}<span class="muted" style="font-size:15px;font-weight:500"> / ${num(mods[1])}</span>`, mods[2] ? `<b style="color:var(--warn)">${mods[2]} incomplete</b>` : "all complete")}</div>
    <div class="grid g-32 mb"><div class="card"><div class="card-hd"><h2>Pipeline</h2></div><div class="card-bd">${stepper(r)}
        <div class="row" style="margin-top:16px">${(r.links.reports || []).map((u) => `<a class="btn sm" href="${esc(fileHref(u))}" target="_blank" rel="noopener">${ic("file")} ${esc(u.split(".").pop().toUpperCase())}</a>`).join("")}</div>
        ${r.suites.map((s) => (s.results_dir ? `<div class="muted mono" style="margin-top:12px;font-size:12px">${esc(s.name)} · ${esc(s.results_dir)}</div>` : "")).join("")}</div></div>
      <div class="card"><div class="card-hd"><h2>Result</h2></div><div class="card-bd"><div class="donut-wrap">${donut(pass, fail, skip, 140)}<div class="legend">
        <div><i style="background:var(--ok)"></i>Passed<b>${num(pass)}</b></div><div><i style="background:var(--bad)"></i>Failed<b>${num(fail)}</b></div><div><i style="background:var(--skip)"></i>Skipped<b>${num(skip)}</b></div></div></div></div></div></div>
    ${r.suites.map((s, i) => suiteDetail(s, i)).join("")}
    ${(r.timeline || []).length ? `<div class="card"><div class="card-hd"><h2>Timeline</h2></div><div class="card-bd"><ul class="tl">${timeline(r)}</ul></div></div>` : ""}`;
  r.suites.forEach((s, i) => bindSuite(s, i));
  const dl = (name, text, type) => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); };
  $("#xjson").addEventListener("click", () => dl(`${r.run_id || r.key}.json`, JSON.stringify(r, null, 2), "application/json"));
  $("#xcsv").addEventListener("click", () => {
    const rows = [["suite", "abi", "module", "done", "pass", "fail", "skip", "total", "runtime_secs", "reason"]];
    r.suites.forEach((s) => ((s.result && s.result.modules) || []).forEach((m) => rows.push([s.name, m.abi, m.name, m.done, m.pass, m.fail, m.skip, m.total, m.runtime_secs, m.reason])));
    dl(`${r.run_id || r.key}_modules.csv`, rows.map((row) => row.map((v) => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n"), "text/csv");
  });
};
function suiteDetail(s, i) {
  const res = s.result;
  if (!res) return `<div class="card mb"><div class="card-hd"><h2>${esc(s.name.toUpperCase())}</h2>${pill(s.status)}</div><div class="empty">No test_result.xml${s.error ? ": " + esc(s.error) : " yet"}.</div></div>`;
  if (res.error) return `<div class="card mb"><div class="card-hd"><h2>${esc(s.name.toUpperCase())}</h2></div><div class="card-bd">${esc(res.error)}</div></div>`;
  const di = res.device_info || {}, fp = di.build_fingerprint || s.fingerprint || "";
  const failing = res.modules.filter((m) => m.fail).sort((a, b) => b.fail - a.fail).slice(0, 8), maxF = Math.max(1, ...failing.map((m) => m.fail));
  return `<div class="card mb"><div class="card-hd"><h2>${esc(s.name.toUpperCase())}</h2>${pill(s.status)}<span class="sub">${num(res.modules_done)} / ${num(res.modules_total)} modules · ${Math.max((res.devices || []).length, (s.devices || []).length)} devices</span>
      <span class="spacer"></span><span class="mono faint ell" style="max-width:520px" title="${esc(fp)}">${esc(fp)}</span></div>
    ${failing.length ? `<div class="card-bd" style="border-bottom:1px solid var(--border)"><div style="font-weight:600;margin-bottom:12px;font-size:13px">Modules with the most failures</div>
      ${failing.map((m) => `<div class="row" style="flex-wrap:nowrap;margin-bottom:7px"><span class="mono ell" style="width:260px;flex:none" title="${esc(m.name)}">${esc(m.name)}</span>
        <div style="flex:1;height:14px;background:var(--panel-3);border-radius:4px;overflow:hidden"><div style="height:100%;width:${(100 * m.fail) / maxF}%;background:var(--bad);opacity:.7;border-radius:4px"></div></div><b style="width:52px;text-align:right">${num(m.fail)}</b></div>`).join("")}</div>` : ""}
    <div class="card-bd"><div class="row" style="margin-bottom:12px"><div class="seg" id="mf${i}"><button class="on" data-m="all">All modules</button><button data-m="fail">With failures</button><button data-m="inc">Incomplete</button></div>
      <span class="spacer"></span><input type="text" id="mq${i}" placeholder="Filter modules" style="width:220px"></div>
    <div class="tw" style="max-height:480px;border:1px solid var(--border);border-radius:10px"><table><thead><tr><th class="sort" data-s="name">Module</th><th>ABI</th><th>Result</th><th class="n sort" data-s="pass">Passed</th><th class="n sort" data-s="fail">Failed</th>
      <th class="n sort" data-s="skip">Skipped</th><th class="n sort" data-s="total">Total</th><th>State</th><th class="n sort" data-s="runtime_secs">Runtime</th><th>Reason</th></tr></thead><tbody id="mt${i}"></tbody></table></div>
    <div style="font-weight:600;margin:20px 0 10px">Failed tests <span class="muted" style="font-weight:400">· ${res.failed_truncated ? `first ${res.failed_tests.length}; all of them are grouped on the triage page` : res.failed_tests.length}</span></div>
    <div class="tw" style="max-height:440px;border:1px solid var(--border);border-radius:10px"><table><thead><tr><th>Test</th><th>Message</th></tr></thead><tbody>
      ${res.failed_tests.map((f) => `<tr><td style="min-width:260px"><div class="mono" style="font-weight:600">${esc(f.test.split("#")[1] || f.test)}</div><div class="muted mono" style="font-size:11.5px">${esc(f.test.split("#")[0])} · ${esc(f.module)}</div></td><td style="color:var(--text-2)">${esc(f.message)}</td></tr>`).join("") || `<tr><td colspan="2"><div class="empty">${ic("check")} No failed tests.</div></td></tr>`}
    </tbody></table></div></div></div>`;
}
function bindSuite(s, i) {
  const res = s.result; if (!res || res.error) return;
  let mode = "all", sortKey = "fail", dir = -1;
  const paint = () => {
    const q = ($("#mq" + i).value || "").toLowerCase();
    const rows = res.modules.filter((m) => (mode === "all" || (mode === "fail" ? m.fail > 0 : !m.done)) && (!q || m.name.toLowerCase().includes(q)))
      .sort((a, b) => (sortKey === "name" ? a.name.localeCompare(b.name) * -dir : (a[sortKey] - b[sortKey]) * dir));
    $("#mt" + i).innerHTML = rows.slice(0, 2000).map((m) => `<tr><td class="mono" style="font-weight:600">${esc(m.name)}</td><td class="mono muted">${esc(m.abi)}</td><td style="width:130px">${sbar(m.pass, m.fail, m.skip)}</td><td class="n">${num(m.pass)}</td>
      <td class="n" ${m.fail ? 'style="color:var(--bad);font-weight:650"' : ""}>${num(m.fail)}</td><td class="n muted">${num(m.skip)}</td><td class="n">${num(m.total)}</td>
      <td>${m.done ? pill("DONE", "done") : pill("INCOMPLETE", "incomplete")}</td><td class="n">${fmtDur(m.runtime_secs)}</td><td class="muted">${esc(m.reason)}</td></tr>`).join("")
      || '<tr><td colspan="10"><div class="empty">No modules match.</div></td></tr>';
  };
  $$("#mf" + i + " button").forEach((b) => b.addEventListener("click", () => { mode = b.dataset.m; $$("#mf" + i + " button").forEach((x) => x.classList.toggle("on", x === b)); paint(); }));
  $("#mq" + i).addEventListener("input", paint);
  $$("th.sort", $("#mt" + i).closest("table")).forEach((th) => th.addEventListener("click", () => { dir = sortKey === th.dataset.s ? -dir : -1; sortKey = th.dataset.s; paint(); }));
  paint();
}

// ================================================================ devices
views.devices = function () {
  $("#view").innerHTML = `<div class="page-hd"><div><h1>Devices</h1><p>What <code>adb</code> sees on this host, who holds each device, and the quarantine list.</p></div><div class="spacer"></div>
    <div class="seg" id="dv"><button class="on" data-v="cards">Cards</button><button data-v="table">Table</button></div><button class="btn" id="rf">${ic("refresh")} Refresh</button></div>
    <div class="kpis" id="dk">${'<div class="card skeleton" style="height:76px"></div>'.repeat(4)}</div><div id="dlist"><div class="skeleton"></div></div>
    <p class="muted" style="margin-top:16px;font-size:12.5px">A run leases each device it uses, so two runs never share one. Devices that fail repeatedly (reboot not coming back, offline mid-suite) are quarantined and skipped until released or the quarantine expires.</p>`;
  let mode = "cards", last = [];
  const state = (d) => (d.quarantine ? "Quarantined" : d.state !== "device" ? d.state.toUpperCase() : !d.booted ? "Booting" : d.leased_by ? "In use" : "Free");
  const holder = (d) => { const m = (d.leased_by || "").match(/pid=(\d+).*?user=(\S+).*?job=(\S+)/); return m ? `pid ${m[1]} · ${m[2]}${m[3] !== "-" ? " · job " + m[3] : ""}` : d.leased_by; };
  const draw = () => {
    const ds = last, on = ds.filter((d) => d.state === "device");
    $("#dk").innerHTML = kpi("ok", "device", "Online", on.length) + kpi("info", "activity", "In use", on.filter((d) => d.leased_by).length) +
      kpi("skip", "check", "Free", on.filter((d) => !d.leased_by && !d.quarantine).length) + kpi("warn", "shield", "Quarantined", ds.filter((d) => d.quarantine).length);
    if (!ds.length) { $("#dlist").innerHTML = `<div class="card"><div class="empty">${ic("device")} No devices. Check <code>adb devices</code> on this host.</div></div>`; return; }
    if (mode === "cards") {
      $("#dlist").innerHTML = `<div class="devgrid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px">${ds.map((d) => { const s = state(d);
        return `<div class="card" style="padding:14px 16px"><div class="row" style="flex-wrap:nowrap"><div class="ic t-${tone(s)}" style="width:36px;height:36px">${ic("device")}</div>
          <div style="min-width:0;flex:1"><div class="mono" style="font-weight:650;font-size:13px">${esc(d.serial)}</div><div class="muted ell" style="font-size:12.5px">${esc(d.model || "–")}</div></div>${pill(s, s)}</div>
          <div class="kv"><span class="muted">Build type</span><span>${esc(d.build_type || "–")}</span>
            <span class="muted">Fingerprint</span><span class="mono ell" style="font-size:11.5px" title="${esc(d.fingerprint || "")}">${esc(d.fingerprint || "–")}</span>
            <span class="muted">Held by</span><span>${d.leased_by ? esc(holder(d)) : '<span class="faint">nobody</span>'}</span>
            ${d.quarantine ? `<span class="muted">Quarantine</span><span style="color:var(--warn)">${esc(d.quarantine)}</span>` : ""}</div>
          ${d.quarantine ? `<button class="btn sm" style="margin-top:12px" data-rel="${esc(d.serial)}">${ic("shield")} Release from quarantine</button>` : ""}</div>`; }).join("")}</div>`;
    } else {
      $("#dlist").innerHTML = `<div class="card"><div class="tw"><table><thead><tr><th>Serial</th><th>State</th><th>Model</th><th>Build</th><th>Fingerprint</th><th>Held by</th><th></th></tr></thead><tbody>
        ${ds.map((d) => { const s = state(d); return `<tr><td class="mono">${esc(d.serial)}</td><td>${pill(s, s)}</td><td>${esc(d.model || "")}</td><td>${esc(d.build_type || "")}</td>
          <td class="mono muted ell" style="max-width:340px;font-size:11.5px" title="${esc(d.fingerprint || "")}">${esc(d.fingerprint || "")}</td><td class="muted">${d.leased_by ? esc(holder(d)) : "–"}</td>
          <td>${d.quarantine ? `<button class="btn sm" data-rel="${esc(d.serial)}">Release</button>` : ""}</td></tr>`; }).join("")}</tbody></table></div></div>`;
    }
    $$("[data-rel]").forEach((b) => b.addEventListener("click", async () => {
      if (!confirm("Release " + b.dataset.rel + " from quarantine? It will be allocated to runs again.")) return;
      try { await api(`/api/devices/${encodeURIComponent(b.dataset.rel)}/release`, { body: {} }); toast("Released"); load(true); } catch (e) { toast(e.message, 6000, "bad"); }
    }));
  };
  const load = async (refresh) => { try { last = await api("/api/devices" + (refresh ? "?refresh=1" : "")); } catch (e) { if ($("#dlist")) $("#dlist").innerHTML = `<div class="card"><div class="empty">${esc(e.message)}</div></div>`; return; } if ($("#dlist")) draw(); };
  $$("#dv button").forEach((b) => b.addEventListener("click", () => { mode = b.dataset.v; $$("#dv button").forEach((x) => x.classList.toggle("on", x === b)); draw(); }));
  $("#rf").addEventListener("click", () => load(true));
  every(() => load(false), 10000);
};

loadOverview(); api("/api/live").then(setActiveCount).catch(() => {}); route();
</script>
</body>
</html>
