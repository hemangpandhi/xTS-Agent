# Development/triage plan: skips modules with known deterministic AAOS failures
# to shorten iteration. Results are NOT valid for certification; use
# full_cts_hardware.yaml (profile: certification) for that.
name: Dev CTS Hardware Triage Run
description: CTS on physical/network ADB devices minus known-failing modules (triage only)
profile: development
devices:
  min_devices: 1
suites:
- name: cts
  priority: 1
  plan: cts
  enabled: true
  exclude_filters:
  - CtsNpuManagerMoblyTestCases
  - CtsWifiMoblyTestCases
  - CtsAppExitTestCases[instant]
  - CtsAppFgsTestCases
  - CtsAppFunctionTestCases[run-on-secondary-user]
  - CtsAppSecurityHostTestCases
  - CtsAppServiceTestCases
  - CtsAppStartAtomHostTestCases[instant]
  - CtsAppTestCases
  - CtsAppTestCases[instant]
  - CtsAutoFillServiceTestCases
  - CtsAutoFillServiceTestCases[instant]
  - CtsBluetoothTestCases
  - CtsCameraTestCases
  - CtsCarTestCases
  - CtsContentResolverTestCases
  - CtsContentTestCases
  - CtsContentTestCases[instant]
  - CtsDevicePolicyManagerTestCases
  - CtsDevicePolicyTestCases
  - CtsDevicePolicyTestCases[run-on-secondary-user]
  - CtsDownloadManagerApi28
  - CtsDownloadManagerInstaller
  - CtsDownloadManagerTestCases
  - CtsGraphicsTestCases[instant]
  - CtsHardwareHealthAtomHostTestCases
  - CtsHardwareHealthAtomHostTestCases[instant]
  - CtsHibernationTestCases
  - CtsHiddenApiBlocklistApi27TestCases
  - CtsHiddenApiBlocklistApi28TestCases
  - CtsHiddenApiBlocklistCurrentApiTestCases
  - CtsHiddenApiBlocklistDebugClassTestCases
  - CtsHiddenApiBlocklistTestApiTestCases
  - CtsHostsideNetworkPolicyTests
  - CtsHostsideNetworkPolicyTests[instant]
  - CtsInputMethodServiceHostTestCases[instant]
  - CtsInputMethodTestCases
  - CtsInputMethodTestCases32
  - CtsInputTestCases
  - CtsKeystorePerformanceTestCases
  - CtsKeystoreTestCases
  - CtsLibcoreTestCases
  - CtsNetAtomHostTestCases
  - CtsNetAtomHostTestCases[instant]
  - CtsOsTestCases
  - CtsOsTestCases[instant]
  - CtsPackageInstallTestCases
  - CtsPackageUninstallTestCases
  - CtsPackageUninstallTestCases[run-on-secondary-user]
  - CtsPermissionUiTestCases
  - CtsPreferenceTestCases
  - CtsProviderUiTestCases
  - CtsSafetyCenterTestCases
  - CtsScopedStorageCompatHostTest
  - CtsSecurityTestCases
  - CtsSensorPrivacyTestCases
  - CtsSettingsHostTestCases
  - CtsSharesheetTestCases
  - CtsStatsdAtomHostTestCases
  - CtsStatsdAtomHostTestCases[instant]
  - CtsStorageHostTestCases
  - CtsSurfaceControlTests
  - CtsSuspendAppsTestCases
  - CtsSyncManagerTestsCases
  - CtsTelecomTestCases
  - CtsTelephonyAtomHostTestCases
  - CtsTelephonyAtomHostTestCases[instant]
  - CtsTextTestCases
  - CtsViewTestCases
  - CtsVirtualDevicesAppLaunchTestCases
  - CtsWebkitTestCases
  - CtsWidgetTestCases
  - CtsWifiAtomHostTestCases
  - CtsWifiAtomHostTestCases[instant]
  - CtsWifiBroadcastsHostTestCases
  - CtsWifiTestCases
  - CtsWindowManagerDeviceActivity
  - CtsWindowManagerDeviceBackNavigation
  - CtsWindowManagerDeviceDisplay
  - CtsWindowManagerDeviceDragAndDrop
  - CtsWindowManagerDeviceInput
  - CtsWindowManagerDeviceInsets
  - CtsWindowManagerDeviceMultiDisplay
  - CtsWindowManagerDeviceWindow
  - CtsWindowManagerHostTestCases
  - CtsWindowManagerJetpackTestCases
  - CtsWindowManagerSdk34TestCases
  sharding:
    enabled: true
    shard_count: auto
  retry:
    max_retries: 2
    strategy: RETRY_ANY_FAILURE
  timeout_hours: 24
  extra_args:
  - --skip-system-status-check
