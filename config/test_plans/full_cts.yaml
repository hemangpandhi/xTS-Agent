name: "Full CTS Sharded Run"
description: "Executing full CTS TradeFed engine across all devices"
devices:
  min_devices: 1
suites:
  - name: "cts"
    priority: 100
    plan: "cts-virtual-device"
    enabled: true
    exclude_filters:
      - "CtsNpuManagerMoblyTestCases"
      - "CtsWifiMoblyTestCases"
    sharding:
      enabled: true
      shard_count: 15
    retry:
      max_retries: 0
      strategy: "RETRY_ANY_FAILURE"
