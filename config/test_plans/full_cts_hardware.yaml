# Certification-grade full CTS on physical/network ADB devices.
# profile: certification forbids exclude/include filters and module subsets.
name: Full CTS Hardware Sharded Run
description: Full CTS on physical/network ADB devices (not cts-virtual-device)
profile: certification
devices:
  min_devices: 1
suites:
- name: cts
  priority: 1
  plan: cts
  enabled: true
  sharding:
    enabled: true
    shard_count: auto
  retry:
    max_retries: 2
    strategy: RETRY_ANY_FAILURE
  timeout_hours: 24
  extra_args:
  - --skip-system-status-check
