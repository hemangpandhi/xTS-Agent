# xTS Agent - Global Default Configuration
# Override per test plan in config/test_plans/*.yaml

agent:
  name: "xTS Agent"
  version: "1.0.0"
  log_level: "INFO"                    # DEBUG | INFO | WARNING | ERROR
  log_dir: "logs"
  results_dir: "results"
  database_path: "results/xts_agent.db"   # SQLite (default)
  database_url: ""                      # optional PostgreSQL; set XTS_DATABASE_URL instead of plaintext

paths:
  xts_packages_dir: "/opt/xts"         # Base directory for downloaded xTS packages
  java_home: "/mnt/aosp-17-master/prebuilts/jdk/jdk21/linux-x86"  # JDK 21 for TradeFed
  android_sdk: "/home/hemang/Android/Sdk"  # SDK root (aapt2)
  adb_path: ""                         # adb binary; empty = first adb on PATH

device:
  min_battery_level: 20                 # Minimum battery percentage
  adb_timeout_secs: 30                  # ADB command timeout
  reboot_timeout_secs: 120              # Device reboot timeout
  # Host-wide device lock files shared by every agent process on this host
  # (also settable via XTS_LEASE_DIR). Must be the same for all CI runners.
  lease_dir: "/var/tmp/xts-agent/leases"
  # Devices failing this many times in a row (reboot not coming back, going
  # offline mid-suite) are skipped for quarantine_hours. Ledger lives next to
  # lease_dir; inspect/release with `xts-agent quarantine`.
  quarantine_after_failures: 3
  quarantine_hours: 24
  # Host-side reset used by FULLY_ISOLATED retries on virtual devices only
  # (physical devices are never wiped). {serial} is substituted, e.g.
  #   "cvd powerwash --instance_num 1"  or a wrapper script mapping serial -> instance
  virtual_reset_command: ""
  # Device preparation applied to every allocated device before each suite
  # (disable per plan with `devices: {prepare: false}`)
  screen_timeout: 2147483647            # Keep screen always on during tests
  disable_screen_lock: true
  enable_location: true
  disable_adb_install_verifier: true    # "Verify apps over USB" off
  connect_wifi: true
  wifi_ssid: ""                         # Test WiFi SSID (configure per environment)
  wifi_password: ""                     # Use "${XTS_WIFI_PASSWORD}" or the env var, never plaintext
  extra_commands: []                    # Additional `adb shell` commands, e.g. OEM demo-mode off

execution:
  suite_timeout_hours: 24               # Per-suite timeout
  # >1 runs that many suites at once on an automatic device split weighted by
  # expected device-hours (measured history, else built-in estimates). Each
  # suite gets >= 1 device; freed devices go to the next pending suite.
  # Overridable per plan with top-level `max_concurrent_suites:`.
  max_concurrent_suites: 1
  reboot_between_suites: false         # default for plans that do not set devices.reboot_between_suites
  cooldown_between_suites_secs: 0      # pause between sequential suites (e.g. thermal settle)

sharding:
  max_shard_count: 16                   # Upper limit on shard count
  # Passed to TradeFed (per suite overridable under `sharding:`)
  dynamic_sharding: true                # --[no-]dynamic-sharding
  token_sharding: false                 # --enable-token-sharding (heterogeneous devices)
  intra_module_sharding: true           # --[no-]intra-module-sharding

retry:
  intra_module:
    max_testcase_run_count: 3
    strategy: "RETRY_ANY_FAILURE"
    isolation_grade: "REBOOT_ISOLATED"
    reboot_at_last_retry: true
  suite_retry:
    enabled: true
    max_retries: 2
    retry_type: "FAILED"                # FAILED | NOT_EXECUTED | BOTH
    cooldown_secs: 60

# TradeFed failure diagnostics (per suite overridable under `artifacts:`)
diagnostics:
  logcat_on_failure: true               # --logcat-on-failure
  screenshot_on_failure: true           # --screenshot-on-failure
  # A bugreport per failing test costs minutes each and GBs of disk on a run
  # with hundreds of failures; enable per suite when needed.
  bugreport_on_failure: false           # --bugreport-on-failure
  max_logcat_size_mb: 50                # --logcat-on-failure-size

rca:
  enabled: true
  ai_powered: false                     # Set true and provide api_key for Gemini
  ai_api_key: ""                        # Gemini API key
  ai_model: "gemini-2.5-flash"
  patterns_file: "config/known_failures/patterns.yaml"
  classify_failures: true

reporting:
  formats:
    - html
    - junit
    - json
  html_report: true
  junit_xml: true                       # GitLab-compatible
  junit_detail: "failures"              # failures = failing tests + 1 summary case/module; all = every test
  json_summary: true
  notifications:
    slack_webhook: ""                   # Slack webhook URL

triage:
  enabled: true                         # group failures + history + known issues + owners
  known_issues_file: "config/known_issues.yaml"
  ownership_file: "config/ownership.yaml"
  history_window: 5                     # earlier runs compared for NEW/PERSISTENT/FLAKY
  history_db: ""                        # default: agent.database_path

# One Jira ticket per actionable failure group (deduplicated by signature label).
# Token only from the XTS_JIRA_TOKEN environment variable.
jira:
  enabled: false
  mode: "dry_run"                       # dry_run = write results/triage/jira_preview_*.json only; live = file
  base_url: "${XTS_JIRA_URL:-}"         # e.g. https://jira.example.com
  project: ""                           # e.g. AAOS
  issue_type: "Bug"
  auth: "bearer"                        # bearer (Server/DC PAT) | basic (Cloud: user + API token)
  user: "${XTS_JIRA_USER:-}"            # basic auth only
  assignee_field: "name"                # "name" (Server/DC) | "accountId" (Cloud)
  labels: ["xts-agent"]
  file_labels: ["NEW", "NO_HISTORY"]    # history labels that get new tickets
  max_new_issues_per_run: 20
  comment_on_existing: true             # comment on the open ticket when a group recurs
  report_url: "${CI_JOB_URL:-}"         # linked from tickets when set

# Optional archive of large artifacts (result zips, reports, triage) in S3 or
# on-prem MinIO; URLs are recorded in the results database. Credentials come
# from the standard AWS env vars (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY).
artifacts:
  store: "none"                         # none | s3  (needs the [s3] extra)
  bucket: ""
  prefix: "xts"
  endpoint_url: ""                      # e.g. http://minio.lab:9000 for MinIO
  region: ""
  upload: ["results", "reports", "triage"]

# Operations: heartbeat, metrics, disk guard, retention
ops:
  progress_interval_secs: 600           # TradeFed progress line in the job log (0 = off)
  status_interval_secs: 15              # live status for `xts-agent ui` (results/run_state/*.json)
  stall_warning_mins: 60                # warn when TradeFed's log is silent this long (0 = off)
  # Prometheus: node_exporter textfile collector dir (writes xts_<plan>.prom)
  # and/or a Pushgateway URL. Empty = off.
  metrics_textfile_dir: ""
  pushgateway_url: ""
  min_free_disk_gb: 20                  # refuse to start a run below this (0 = off)
  keep_results_days: 0                  # default for `cleanup --prune-results` (0 = keep)

ats2:
  enabled: false                        # Set true to use OmniLab ATS 2.0
  base_url: ""                          # ATS 2.0 server URL
  api_key: ""                           # CI/CD API key
  timeout_secs: 30
  # EXPERIMENTAL: endpoint not verified against a real OmniLab ATS deployment
  upload_path: "/api/v1/results/upload"

# AI Root Cause Analysis Configuration
ai_rca:
  enabled: false                        # Set true in test plan or CLI to run GPU AI RCA
  provider: "openai_compatible"         # "openai_compatible" (local GPU server, default), "llama_cpp" or "gemini"
  # External providers receive failure logs, stack traces and retrieved OEM
  # source code. They are refused unless this is explicitly set to true.
  allow_external_providers: false
  request_timeout_secs: 180

  # Gemini Configuration (external; requires allow_external_providers: true)
  gemini_api_key: ""
  gemini_model: "gemini-2.5-flash"
  
  # OpenAI-compatible chat-completions server. On-prem servers (Ollama, vLLM,
  # llama.cpp server, LM Studio) on this host or a private network need no
  # opt-in; a hosted endpoint (OpenAI, Gemini's OpenAI API, OpenRouter) is
  # external and requires allow_external_providers: true. Key: XTS_LLM_API_KEY.
  # This lab: vLLM on the RTX 6000 Ada serving Qwen3.8-27B-FP8 as "coder"
  # (start: PORT=8011 /mnt/OEM/llm-env/serve_qwen.sh). Never leaves the machine.
  openai_base_url: "http://127.0.0.1:8011/v1"
  openai_model: "coder"
  openai_api_key: "${XTS_LLM_API_KEY:-}"
  openai_extra_body:
    chat_template_kwargs: {enable_thinking: false}   # Qwen3 reasoning off: JSON answers only
  # Tried in order when the server above is down (all on-prem). After 3
  # consecutive failures the remaining groups are skipped instead of timing out.
  openai_fallbacks:
    - base_url: "http://127.0.0.1:11434/v1"
      model: "qwen2.5-coder:32b"        # Ollama; fits the GPU only when vLLM is not running

  # Llama.cpp (Direct GGUF) Configuration
  llama_model_path: "/usr/share/ollama/.ollama/models/blobs/sha256-ac3d1ba8aa77755dab3806d9024e9c385ea0d5b412d6bdf9157f8a4a7e9fc0d9"
  llama_n_ctx: 16384 # Large context for logs + code
  llama_n_gpu_layers: -1 # -1 offloads everything to GPU
  
  # One structured LLM call per actionable failure group (largest first),
  # cached by signature; results are advisory (shown in reports and Jira)
  max_groups: 20

  # RAG / OEM Code Indexer (build/update with `xts-agent index-code`)
  embedding_model: "all-MiniLM-L6-v2"   # or a local model dir for offline labs
  index_db_path: "config/known_failures/chroma_db"
  source_code_paths:
    - "/mnt/aosp-17-master/cts/common/device-side/util-axt"
    - "/mnt/aosp-17-master/cts/common/device-side/bedstead/nene"
    - "/mnt/aosp-17-master/cts/tests/framework/base/windowmanager/util"
    - "/mnt/aosp-17-master/cts/tests/framework/base/windowmanager/src"
    - "/mnt/aosp-17-master/cts/tests/app/src"
    - "/mnt/aosp-17-master/cts/tests/inputmethod"
    - "/mnt/aosp-17-master/cts/hostsidetests/scopedstorage"
    - "/mnt/aosp-17-master/packages/services/Car/tests/EmbeddedKitchenSinkApp"
    - "/mnt/aosp-17-master/packages/services/Car/service/src/com/android/car/user"
    - "/mnt/aosp-17-master/frameworks/base/services/core/java/com/android/server/wm"
    - "/mnt/aosp-17-master/frameworks/base/services/core/java/com/android/server/pm"
    - "/mnt/aosp-17-master/frameworks/base/services/core/java/com/android/server/inputmethod"
    - "/mnt/aosp-17-master/frameworks/base/services/core/java/com/android/server/notification"

# Closed-loop fixing: `xts-agent fix-loop --test "<Module> <Class#method>"`.
# Each iteration is a real TradeFed run on the DUT; only remediations from
# remediations_file are ever applied (the LLM can choose among them, never
# add commands). See docs/FIX_LOOP.md.
fix_loop:
  suite_path: "/opt/xts/android-cts"
  command_name: "cts-tradefed"
  plan: "cts"
  remediations_file: "config/remediations.yaml"
  out_dir: "results/fixloop"
  max_iterations: 6                     # TradeFed runs per target, baseline included
  confirm_runs: 1                       # a fix must pass again before it counts
  flaky_retries: 1
  run_timeout_hours: 1.0
  use_llm: true                         # local LLM from ai_rca (never external unless allowed there)
  # Optional overrides of the ai_rca endpoint for the loop (llm_base_url,
  # llm_model, llm_extra_body, llm_fallbacks). Unset: same server and
  # fallback chain as ai_rca above.
  llm_timeout_secs: 600                 # calls are serialized; a shared server may queue them
  # Revive a hung DUT ({serial}, {cvd_instance} for Cuttlefish adb ports 6520+).
  # This lab: restart one Cuttlefish instance of the 8-instance group, keeping its data.
  restart_command: "env HOME=/tmp/cvd_cluster_home /mnt/aosp-17-master/out/host/linux-x86/bin/restart_cvd -instance_num={cvd_instance} -boot_timeout=600"
  adb_path: "adb"
  variables:                            # used by remediations as {var.NAME}
    lab_wifi_ssid: "VirtWifi"           # Cuttlefish AP; your lab SSID on hardware
    lab_wifi_security: "open"           # open | owe | wpa2 <passphrase> | wpa3 <passphrase>
  # OEM code the loop reads to explain failures. Sources whose `packages`
  # appear in the failure (stack, message, focused window) are searched first.
  # kind: local -> a folder on this host; kind: mcp -> an MCP server (stdio)
  # exposing code search, e.g. in front of your Gerrit/GitLab. Nothing leaves the host
  # unless your MCP server sends it.
  # The AOSP Car apps below stand in for OEM-modified versions in this lab.
  oem_sources:
    - name: CarLauncher
      kind: local
      path: "/mnt/aosp-17-master/packages/apps/Car/Launcher"
      packages: ["com.android.car.carlauncher"]
    - name: CarSettings
      kind: local
      path: "/mnt/aosp-17-master/packages/apps/Car/Settings"
      packages: ["com.android.car.settings"]
    - name: CarSystemUI
      kind: local
      path: "/mnt/aosp-17-master/packages/apps/Car/SystemUI"
      packages: ["com.android.systemui"]
    # The device config this product really builds with (overlays, makefiles)
    - name: CuttlefishAutoDevice
      kind: local
      path: "/mnt/aosp-17-master/device/google/cuttlefish/shared/auto"
      packages: ["com.android.car.dialer", "android.app.role"]
    - name: CarService
      kind: local
      path: "/mnt/aosp-17-master/packages/services/Car/service"
      packages: ["com.android.car"]
    # - name: oem-code-search
    #   kind: mcp
    #   command: "/opt/oem/bin/code-search-mcp --repo-root /src/oem"
    #   search_tool: "search_code"          # called with {"query": ..., "limit": ...}
    #   packages: ["com.oem.launcher", "com.oem.settings"]
  # Product bugs: patch the OEM source, build, flash, re-run until green.
  # Needs oem_sources entries with `editable: true` and `build_targets`.
  code_fix:
    enabled: false
    build_command: "scripts/aosp_build.sh {modules}"          # {modules}: build_targets of touched sources
    deploy_command: "scripts/cf_flash.sh {serial}"            # e.g. fastboot flashall -w on real hardware
    workdir: "."
    build_timeout_secs: 5400
    deploy_timeout_secs: 1800
    max_attempts: 2                       # patches tried per target
    restore_on_failure: true              # reflash the unpatched source if no patch worked
