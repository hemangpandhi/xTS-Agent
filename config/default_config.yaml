# xTS Agent - Global Default Configuration
# Override per test plan in config/test_plans/*.yaml

agent:
  name: "xTS Agent"
  version: "1.0.0"
  log_level: "INFO"                    # DEBUG | INFO | WARNING | ERROR
  log_dir: "logs"
  results_dir: "results"
  database_path: "results/xts_agent.db"   # SQLite (default)
  database_url: ""                      # optional PostgreSQL; set XTS_DATABASE_URL instead of plaintext

paths:
  xts_packages_dir: "/opt/xts"         # Base directory for downloaded xTS packages
  java_home: ""                        # JDK for TradeFed; empty = environment's JAVA_HOME/PATH
  android_sdk: ""                      # SDK root (aapt2); empty = ANDROID_HOME / common locations
  adb_path: ""                         # adb binary; empty = first adb on PATH

device:
  min_battery_level: 20                 # Minimum battery percentage
  adb_timeout_secs: 30                  # ADB command timeout
  reboot_timeout_secs: 120              # Device reboot timeout
  # Host-wide device lock files shared by every agent process on this host
  # (also settable via XTS_LEASE_DIR). Must be the same for all CI runners.
  lease_dir: "/var/tmp/xts-agent/leases"
  # Devices failing this many times in a row (reboot not coming back, going
  # offline mid-suite) are skipped for quarantine_hours. Ledger lives next to
  # lease_dir; inspect/release with `xts-agent quarantine`.
  quarantine_after_failures: 3
  quarantine_hours: 24
  # Host-side reset used by FULLY_ISOLATED retries on virtual devices only
  # (physical devices are never wiped). {serial} is substituted, e.g.
  #   "cvd powerwash --instance_num 1"  or a wrapper script mapping serial -> instance
  virtual_reset_command: ""
  # Device preparation applied to every allocated device before each suite
  # (disable per plan with `devices: {prepare: false}`)
  screen_timeout: 2147483647            # Keep screen always on during tests
  disable_screen_lock: true
  enable_location: true
  disable_adb_install_verifier: true    # "Verify apps over USB" off
  connect_wifi: true
  wifi_ssid: ""                         # Test WiFi SSID (configure per environment)
  wifi_password: ""                     # Use "${XTS_WIFI_PASSWORD}" or the env var, never plaintext
  extra_commands: []                    # Additional `adb shell` commands, e.g. OEM demo-mode off

execution:
  suite_timeout_hours: 24               # Per-suite timeout
  # >1 runs that many suites at once on an automatic device split weighted by
  # expected device-hours (measured history, else built-in estimates). Each
  # suite gets >= 1 device; freed devices go to the next pending suite.
  # Overridable per plan with top-level `max_concurrent_suites:`.
  max_concurrent_suites: 1
  reboot_between_suites: false         # default for plans that do not set devices.reboot_between_suites
  cooldown_between_suites_secs: 0      # pause between sequential suites (e.g. thermal settle)

sharding:
  max_shard_count: 16                   # Upper limit on shard count
  # Passed to TradeFed (per suite overridable under `sharding:`)
  dynamic_sharding: true                # --[no-]dynamic-sharding
  token_sharding: false                 # --enable-token-sharding (heterogeneous devices)
  intra_module_sharding: true           # --[no-]intra-module-sharding

retry:
  intra_module:
    max_testcase_run_count: 3
    strategy: "RETRY_ANY_FAILURE"
    isolation_grade: "REBOOT_ISOLATED"
    reboot_at_last_retry: true
  suite_retry:
    enabled: true
    max_retries: 2
    retry_type: "FAILED"                # FAILED | NOT_EXECUTED | BOTH
    cooldown_secs: 60

# TradeFed failure diagnostics (per suite overridable under `artifacts:`)
diagnostics:
  logcat_on_failure: true               # --logcat-on-failure
  screenshot_on_failure: true           # --screenshot-on-failure
  # A bugreport per failing test costs minutes each and GBs of disk on a run
  # with hundreds of failures; enable per suite when needed.
  bugreport_on_failure: false           # --bugreport-on-failure
  max_logcat_size_mb: 50                # --logcat-on-failure-size

rca:
  enabled: true
  ai_powered: false                     # Set true and provide api_key for Gemini
  ai_api_key: ""                        # Gemini API key
  ai_model: "gemini-2.0-flash"
  patterns_file: "config/known_failures/patterns.yaml"
  classify_failures: true

reporting:
  formats:
    - html
    - junit
    - json
  html_report: true
  junit_xml: true                       # GitLab-compatible
  junit_detail: "failures"              # failures = failing tests + 1 summary case/module; all = every test
  json_summary: true
  notifications:
    slack_webhook: ""                   # Slack webhook URL

triage:
  enabled: true                         # group failures + history + known issues + owners
  known_issues_file: "config/known_issues.yaml"
  ownership_file: "config/ownership.yaml"
  history_window: 5                     # earlier runs compared for NEW/PERSISTENT/FLAKY
  history_db: ""                        # default: agent.database_path

# One Jira ticket per actionable failure group (deduplicated by signature label).
# Token only from the XTS_JIRA_TOKEN environment variable.
jira:
  enabled: false
  mode: "dry_run"                       # dry_run = write results/triage/jira_preview_*.json only; live = file
  base_url: "${XTS_JIRA_URL:-}"         # e.g. https://jira.example.com
  project: ""                           # e.g. AAOS
  issue_type: "Bug"
  auth: "bearer"                        # bearer (Server/DC PAT) | basic (Cloud: user + API token)
  user: "${XTS_JIRA_USER:-}"            # basic auth only
  assignee_field: "name"                # "name" (Server/DC) | "accountId" (Cloud)
  labels: ["xts-agent"]
  file_labels: ["NEW", "NO_HISTORY"]    # history labels that get new tickets
  max_new_issues_per_run: 20
  comment_on_existing: true             # comment on the open ticket when a group recurs
  report_url: "${CI_JOB_URL:-}"         # linked from tickets when set

# Optional archive of large artifacts (result zips, reports, triage) in S3 or
# on-prem MinIO; URLs are recorded in the results database. Credentials come
# from the standard AWS env vars (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY).
artifacts:
  store: "none"                         # none | s3  (needs the [s3] extra)
  bucket: ""
  prefix: "xts"
  endpoint_url: ""                      # e.g. http://minio.lab:9000 for MinIO
  region: ""
  upload: ["results", "reports", "triage"]

# Operations: heartbeat, metrics, disk guard, retention
ops:
  progress_interval_secs: 600           # TradeFed progress line in the job log (0 = off)
  stall_warning_mins: 60                # warn when TradeFed's log is silent this long (0 = off)
  # Prometheus: node_exporter textfile collector dir (writes xts_<plan>.prom)
  # and/or a Pushgateway URL. Empty = off.
  metrics_textfile_dir: ""
  pushgateway_url: ""
  min_free_disk_gb: 20                  # refuse to start a run below this (0 = off)
  keep_results_days: 0                  # default for `cleanup --prune-results` (0 = keep)

ats2:
  enabled: false                        # Set true to use OmniLab ATS 2.0
  base_url: ""                          # ATS 2.0 server URL
  api_key: ""                           # CI/CD API key
  timeout_secs: 30
  # EXPERIMENTAL: endpoint not verified against a real OmniLab ATS deployment
  upload_path: "/api/v1/results/upload"

# AI Root Cause Analysis Configuration
ai_rca:
  enabled: false
  provider: "llama_cpp"                 # "llama_cpp" (on-prem, default) or "gemini" (external)
  # External providers receive failure logs, stack traces and retrieved OEM
  # source code. They are refused unless this is explicitly set to true.
  allow_external_providers: false
  request_timeout_secs: 120

  # Gemini Configuration (external; requires allow_external_providers: true)
  gemini_api_key: ""
  gemini_model: "gemini-1.5-pro"
  
  # Llama.cpp (Local GPU) Configuration
  llama_model_path: "/path/to/models/DeepSeek-Coder-V2.gguf"
  llama_n_ctx: 16384 # Large context for logs + code
  llama_n_gpu_layers: -1 # -1 offloads everything to GPU
  
  # One structured LLM call per actionable failure group (largest first),
  # cached by signature; results are advisory (shown in reports and Jira)
  max_groups: 20

  # RAG / OEM Code Indexer (build/update with `xts-agent index-code`)
  embedding_model: "all-MiniLM-L6-v2"   # or a local model dir for offline labs
  index_db_path: "config/known_failures/chroma_db"
  source_code_paths:
    - "/mnt/aosp/vendor"
    - "/mnt/aosp/hardware"
