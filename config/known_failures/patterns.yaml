# Known Failure Patterns for RCA Engine
# =====================================
# Each pattern defines a regex to match against error messages and stack traces,
# along with its classification and description.
#
# Classification types:
#   INFRASTRUCTURE_FAILURE - Device/environment issues
#   FLAKY_TEST            - Intermittent/non-deterministic failures
#   ENVIRONMENT_ISSUE     - Missing prerequisites, wrong config
#   PRODUCT_BUG           - Genuine code regression
#   TEST_BUG              - Bug in the test itself

patterns:
  # ── Infrastructure Failures ────────────────────────────────
  - pattern: "DeviceNotAvailableException"
    classification: "INFRASTRUCTURE_FAILURE"
    description: "Device became unavailable during test execution"
    known_bug_id: ""
    suggested_action: "Check USB connection, reboot device, verify adb authorization"

  - pattern: "com\\.android\\.tradefed\\.device\\.DeviceUnresponsiveException"
    classification: "INFRASTRUCTURE_FAILURE"
    description: "Device stopped responding to ADB commands"
    suggested_action: "Reboot device, check for thermal throttling or hardware issues"

  - pattern: "Connection reset by peer"
    classification: "INFRASTRUCTURE_FAILURE"
    description: "ADB connection was reset unexpectedly"
    suggested_action: "Check USB cable, try different USB port, verify adb server"

  - pattern: "java\\.lang\\.OutOfMemoryError"
    classification: "INFRASTRUCTURE_FAILURE"
    description: "Host or device ran out of memory"
    suggested_action: "Increase TradeFed heap size (-Xmx), check device RAM"

  - pattern: "device '.*' not found"
    classification: "INFRASTRUCTURE_FAILURE"
    description: "Device serial not found by ADB"
    suggested_action: "Verify device connection, run 'adb devices'"

  - pattern: "error: no devices/emulators found"
    classification: "INFRASTRUCTURE_FAILURE"
    description: "No devices connected to ADB"
    suggested_action: "Connect device and verify with 'adb devices'"

  - pattern: "RUNNER_ERROR"
    classification: "INFRASTRUCTURE_FAILURE"
    description: "TradeFed test runner encountered an internal error"
    suggested_action: "Check TradeFed logs, verify Java version compatibility"

  - pattern: "Tradefed subprocess.*timed out"
    classification: "INFRASTRUCTURE_FAILURE"
    description: "TradeFed subprocess exceeded timeout"
    suggested_action: "Increase timeout, check device responsiveness"

  # ── Environment Issues ─────────────────────────────────────
  - pattern: "ConnectException.*Connection refused"
    classification: "ENVIRONMENT_ISSUE"
    description: "Network connection refused - service not running"
    suggested_action: "Verify network services, check WiFi connectivity"

  - pattern: "UnknownHostException"
    classification: "ENVIRONMENT_ISSUE"
    description: "DNS resolution failure"
    suggested_action: "Check network configuration and DNS settings"

  - pattern: "No such file or directory"
    classification: "ENVIRONMENT_ISSUE"
    description: "Required file not found on device or host"
    suggested_action: "Verify test prerequisites and file paths"

  - pattern: "INSTALL_FAILED_"
    classification: "ENVIRONMENT_ISSUE"
    description: "APK installation failure"
    suggested_action: "Check device storage, permissions, and APK compatibility"

  - pattern: "Error: Activity class .* does not exist"
    classification: "ENVIRONMENT_ISSUE"
    description: "Test activity not found on device"
    suggested_action: "Verify APK is installed, check package name"

  - pattern: "SecurityException.*Permission Denial"
    classification: "ENVIRONMENT_ISSUE"
    description: "Permission not granted for test operation"
    suggested_action: "Check test permissions, run on userdebug build"

  - pattern: "was focused instead|must have window focus|Timed out waiting for window to be on top|Failed to find sharesheet on screen|Unable to wait for the .* activity|Could not launch intent .* within \\d+ milliseconds"
    classification: "ENVIRONMENT_ISSUE"
    description: "Another window/activity held focus, obscured the screen, or blocked activity launch"
    suggested_action: "Close or disable interfering foreground/system apps (e.g. KitchenSink, overlays) and verify screen state"

  - pattern: "not found within the timeout:\\s*(ImeEventStream|A\\d*yImeEventStream)|showSoftInput must success if the View has IME focus|InputMethodVisibilityVerifier\\.expectImeVisible|mDefaultDeviceImeListener\\.onShow|Editor label must exists on WebView|The panel should receive IME insets|Wait until InProcIme becomes ready|CtsInputMethod1\\.onStartInput is called|VirtualDeviceImeTest\\.customImeComponent|FocusHandlingTest\\.testKeyboardStateAfterImeFocusableFlagChanged|InputMethodManagerTest\\.testIsAcceptingText"
    classification: "ENVIRONMENT_ISSUE"
    description: "IME input binding/visibility failed because the test window did not receive window focus"
    suggested_action: "Ensure no background/debug activity (e.g. KitchenSink) is holding window focus during IME tests"

  - pattern: "WindowUntrustedTouchTestBase\\.removeActivityOverlays"
    classification: "ENVIRONMENT_ISSUE"
    description: "Cascading @After tearDown() NPE on null mContext after @Before setUp() aborted waiting for activity focus"
    suggested_action: "Dismiss interfering foreground activity (com.google.android.car.kitchensink) so test activity setUp() completes"

  - pattern: "(?s:UiObject2\\.(findObjects|click|getText).*on a null object reference)|TestUtils\\.scrollToAndGetTextObject"
    classification: "ENVIRONMENT_ISSUE"
    description: "UIAutomator UiObject2 was null because the test activity was occluded by an interfering foreground window"
    suggested_action: "Dismiss interfering foreground activity (e.g. KitchenSink) so the test UI is visible on screen"

  - pattern: "OnBackInvokedCallback\\.onBackInvoked\\(\\) was not called|OnBackPressed should have been called|No SurfaceView found,\\s*condition=false|MediaStoreUiTest\\.(findDocument|assertToolbarTitleEquals)|DownloadManagerTest\\.findDocument|UiDumpWrapperException:\\s*(View with text|Notification list|No scrollable exists)|Targeted input event injection.*was not directed at a window|Window did not become visible|Given dialog title.*not shown|Policy transparency dialog.*not found|(?s:SuspendPackageTest\\.dismissPolicyTransparencyDialog)|ClipboardManagerTest\\.testClipSourceRecordedWhenClipSet|ClipDescriptionTest\\.testClassificationNotPerformedForVeryLongText|HideOverlayWindowsTest.*getMotionEvent|CtsRequirementException:.*does not have focus|TestActivity should be resumed|window to be focused|Activity with id=placeholderActivity should be resumed|WindowChangeTimeoutException:\\s*no window change event|TestUtils\\.doEscalation|SensorPrivacyBaseTest\\.unblockSensorWithDialogAndAssert|MultipleStepsSignInActivityTest\\.testShowFillDialog|ActivityLaunchUriPermissionTest\\.testImplicitGrantForSend|ActionBarTest\\.testOptionsMenuKey|SearchManagerTest\\.testStopSearch|App hasn't come to the top of LRU list after getting back to foreground"
    classification: "ENVIRONMENT_ISSUE"
    description: "Test window, clipboard access, or system confirmation dialog was occluded or unfocused due to an interfering foreground activity"
    suggested_action: "Force-stop interfering foreground apps (e.g. com.google.android.car.kitchensink) before running UI/WM suites"

  - pattern: "Setup issue:.*network|No valid test network|Make sure you have WiFi|Network should be available|Timed out waiting for network availability|Expected disconnected and connected atoms|Active network doesn't support setting metered status|PrivateDnsPolicyTest|Wi-Fi network unavailable|Wifi not connected|Could not connect to any of the test domains|CapabilitiesChanged.*CELLULAR"
    classification: "ENVIRONMENT_ISSUE"
    description: "Missing Wi-Fi, metered network, or internet connectivity required by CTS"
    suggested_action: "Connect device to a valid Wi-Fi/internet network before running connectivity/download suites"

  - pattern: "No initial user available|initial user was null|SelfManagedConnectionTest\\.getDefaultDialer|TelephonyStatsTests\\.testCarrierServiceConfigOverridesReported|does not have a CDM association|(?s:Companion Device Associations:.*mDeviceMacAddress=null)|BatteryHealthTests\\.testBatteryHealthAtomValid|(?s:SystemUtil\\.eventually.*Hibernation)|(?s:XrWindowProperties.*Error: Hidden field accessible)|UID=2000 \\[com\\.android\\.shell\\]"
    classification: "ENVIRONMENT_ISSUE"
    description: "Missing device/emulator precondition or userdebug/@FlaggedApi build-config skew"
    suggested_action: "Verify AAOS device provisioning and match CTS suite release config / user build variant"

  # ── Flaky Test Indicators ──────────────────────────────────
  - pattern: "SocketTimeoutException"
    classification: "FLAKY_TEST"
    description: "Network socket timeout - often intermittent"
    suggested_action: "Retry test, check network stability"

  - pattern: "android\\.view\\.animation"
    classification: "FLAKY_TEST"
    description: "Animation timing issue - common source of flakiness"
    suggested_action: "Disable animations on device, retry test"

  - pattern: "UiObjectNotFoundException|RetryableException:\\s*waitForObject|RetryableException:\\s*no event|UiDumpWrapperException:\\s*View not found after waiting|SafeCleanerRule\\$MultipleExceptions|should not time out waiting on latch|TestUtils\\.waitOnMainUntil|Timeout on command s_command_get_config|Timed out waiting for next line|CompletableFuture\\.timedGet|Timed out executing test|AssertionError:\\s*Timeout for waiting|(?s:ExternalStorageTest#testDownloadManagerPackage.*TimeoutException)"
    classification: "FLAKY_TEST"
    description: "UI element or async event not received within timeout - contention or rendering delay"
    suggested_action: "Retry under lower shard load or inspect UI hierarchy dump"

  # ── Product Bug Indicators ─────────────────────────────────
  - pattern: "FATAL EXCEPTION.*in.*android\\."
    classification: "PRODUCT_BUG"
    description: "Fatal crash in Android framework code"
    suggested_action: "Investigate stack trace, file bug report"

  - pattern: "Native crash.*SIGSEGV"
    classification: "PRODUCT_BUG"
    description: "Native segfault in product code"
    suggested_action: "Check tombstone, investigate native code"

  - pattern: "SystemServiceRegistry.*not found"
    classification: "PRODUCT_BUG"
    description: "System service not registered"
    suggested_action: "Check service manifest, verify system build"

  # ── Test Bug Indicators ────────────────────────────────────
  - pattern: "Mock ConnectionService exists\\. Failed to call setUp"
    classification: "TEST_BUG"
    description: "Previous test leaked MockConnectionService state into subsequent test setUp"
    suggested_action: "Ensure Telecom CTS test tearDown cleans up MockConnectionService"

  - pattern: "NoSuchMethodError.*at.*test"
    classification: "TEST_BUG"
    description: "Missing method in test code - API mismatch"
    suggested_action: "Verify test version matches target API level"
