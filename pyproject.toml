[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xts-agent"
version = "1.0.0"
description = "xTS Agent framework for Android Automotive OS (AAOS) test automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.0",
    "requests>=2.31",
    "xmltodict>=0.13"
]

[project.scripts]
xts-agent = "xts_agent.cli:main"
