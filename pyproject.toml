[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xts-agent"
version = "1.0.0"
description = "xTS Agent framework for Android Automotive OS (AAOS) test automation"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.0",
    "requests>=2.31",
    "xmltodict>=0.13"
]

[project.optional-dependencies]
# AI RCA (on-prem llama.cpp + code RAG). Heavy: pulls torch and builds
# llama.cpp natively, so it is opt-in: pip install ".[ai]"
ai = [
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "llama-cpp-python>=0.2.50"
]

[project.scripts]
xts-agent = "xts_agent.cli:main"

[tool.setuptools.packages.find]
include = ["xts_agent*"]

[tool.setuptools.package-data]
xts_agent = ["reporting/templates/*.html"]
