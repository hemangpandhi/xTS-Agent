[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xts-agent"
version = "1.0.0"
description = "xTS Agent framework for Android Automotive OS (AAOS) test automation"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.0",
    "requests>=2.31",
    "xmltodict>=0.13"
]

[project.optional-dependencies]
# Shared PostgreSQL store for multi-host farms: pip install ".[postgres]"
postgres = ["psycopg[binary]>=3.1"]
# Artifact archive in S3 / MinIO: pip install ".[s3]"
s3 = ["boto3>=1.26"]
# AI RCA (on-prem llama.cpp + code RAG). Heavy: pulls torch and builds
# llama.cpp natively, so it is opt-in: pip install ".[ai]"
ai = [
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "llama-cpp-python>=0.2.50",
    # ChromaDB needs SQLite >= 3.35; Ubuntu 20.04 ships 3.31
    "pysqlite3-binary>=0.5; platform_system == 'Linux'",
    # chromadb's telemetry dependency; >=3.16 uses Python 3.9+ syntax
    "posthog<3.16; python_version < '3.9'"
]

# Lint/type-check gate (CI `check` stage). Pinned exactly so every Python
# version and every developer gets the same findings: pip install ".[dev]"
dev = [
    "ruff==0.16.10",
    "mypy==1.14.1",  # last release that runs on Python 3.8
    "types-PyYAML==6.0.12.20241230",
    "types-requests==2.31.0.6",  # newer stubs need urllib3 2, which needs Python 3.10 here
]

[project.scripts]
xts-agent = "xts_agent.cli:main"

[tool.setuptools.packages.find]
include = ["xts_agent*"]

[tool.setuptools.package-data]
xts_agent = ["reporting/templates/*.html"]

[tool.ruff]
target-version = "py38"
line-length = 120
extend-exclude = ["results", ".pip-cache"]

[tool.ruff.lint]
# Correctness-focused: pyflakes, syntax/statement errors, import order,
# bugbear, file handles, unchecked subprocess, mutable class defaults,
# silently swallowed exceptions, logging misuse. Style-only rule sets
# (pyupgrade, line length) are left out to keep the diff reviewable.
select = ["E4", "E7", "E9", "F", "I", "B", "SIM115", "PLW1510", "RUF012", "S110", "G"]
ignore = [
    "G004",  # f-strings in log calls: harmless here, fixed opportunistically
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM115"]

[tool.mypy]
# Checks against the interpreter it runs on (3.8 on the CI host today)
files = ["xts_agent"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
